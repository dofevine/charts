# this block sets the port of the service that connects to the pod
service:
  annotations: {}
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http

# this block sets the port of the pod that the service will connect to
ports:
  - name: http
    containerPort: 80
    protocol: TCP

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/

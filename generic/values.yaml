# this block is for setting any additional configuration needed to deploy the app
# note that is also necessary to mount the configmap in the volume or the environment variable
configmap:
  enabled: false
  data: {}

# this block is used to connect the app to any vault supported by secrets store csi driver
# note that is also necessary to mount the secret in the volume
# more on: https://secrets-store-csi-driver.sigs.k8s.io/
spc:
  enabled: false
  provider: ""
  parameters: {}

persistence:
  enabled: false

name: Helm Package and Publish

on:
  push:
    branches:
      - main

jobs:
  package-helm-chart:
    permissions:
      contents: read
      packages: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check changes
        id: changes
        run: |
          CHARTS=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} \
            | grep -E 'Chart.yaml|values.yaml|templates/' \
            | xargs -I{} dirname {} \
            | sort -u || true)
          if [ $CHARTS ]; then
            echo "Charts changed:"
            echo "$CHARTS"
          else
            echo "No changes detected"
          fi
          echo "charts<<EOF" >> $GITHUB_OUTPUT
          echo "$CHARTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Validate chart version update
        if: steps.changes.outputs.charts != ''
        run: |
          FAILED=0

          for chart in ${{ steps.changes.outputs.charts }}; do
            if [ ! -f "$chart/Chart.yaml" ]; then
              continue
            fi

            echo "Checking $chart"

            OLD_VERSION=$(git show ${{ github.event.before }}:$chart/Chart.yaml 2>/dev/null | grep '^version:' | awk '{print $2}')
            NEW_VERSION=$(grep '^version:' $chart/Chart.yaml | awk '{print $2}')

            echo "Old version: $OLD_VERSION"
            echo "New version: $NEW_VERSION"

            if [ -z "$OLD_VERSION" ]; then
              echo "New chart detected (no previous version)"
              continue
            fi

            if [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
              echo "Version not updated for $chart"
              FAILED=1
            else
              echo "Version updated for $chart"
            fi
          done

          if [ $FAILED -eq 1 ]; then
            echo "One or more charts were modified without version update."
            exit 1
          fi

      - name: Package
        if: steps.changes.outputs.charts != ''
        run: |
          mkdir -p packaged
          for chart in ${{ steps.changes.outputs.charts }}; do
            if [ -f "$chart/Chart.yaml" ]; then
              helm package $chart -d packaged
            fi
          done

      - name: Push
        if: steps.changes.outputs.charts != ''
        run: |
          cd packaged
          for chart in ./*; do
            helm push $chart oci://ghcr.io/${{ github.repository }}
          done

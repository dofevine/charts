name: Helm Package and Publish

on:
  push:
    branches:
      - main

jobs:
  package-helm-chart:
    permissions:
      contents: read
      packages: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check changes
        id: changes
        run: |
          CHARTS=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} \
            | grep -E 'Chart.yaml|values.yaml|templates/' \
            | xargs -I{} dirname {} \
            | sort -u || true)
          if [ $CHARTS ]; then
            echo "Charts changed:"
            echo "$CHARTS"
          else
            echo "No changes detected"
          fi
          echo "charts<<EOF" >> $GITHUB_OUTPUT
          echo "$CHARTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Auto bump chart version
        if: steps.changes.outputs.charts != ''
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          for chart in ${{ steps.changes.outputs.charts }}; do
            if [ ! -f "$chart/Chart.yaml" ]; then
              continue
            fi

            OLD_VERSION=$(git show ${{ github.event.before }}:$chart/Chart.yaml 2>/dev/null | grep '^version:' | awk '{print $2}')
            NEW_VERSION=$(grep '^version:' $chart/Chart.yaml | awk '{print $2}')

            if [ "$OLD_VERSION" = "$NEW_VERSION" ] || [ -z "$OLD_VERSION" ]; then
              IFS='.' read -r MAJOR MINOR PATCH <<< "$NEW_VERSION"
              PATCH=$((PATCH + 1))
              BUMPED_VERSION="$MAJOR.$MINOR.$PATCH"
              echo "Updating $chart version: $NEW_VERSION -> $BUMPED_VERSION"
              sed -i "s/^version:.*/version: $BUMPED_VERSION/" $chart/Chart.yaml
              git add $chart/Chart.yaml
            fi
          done

          git commit -m "task: update chart version(s) automatically" || echo "No changes to commit"
          git push origin main || echo "Push failed (maybe no changes)"
      - name: Package
        if: steps.changes.outputs.charts != ''
        run: |
          mkdir -p packaged
          for chart in ${{ steps.changes.outputs.charts }}; do
            if [ -f "$chart/Chart.yaml" ]; then
              helm package $chart -d packaged
            fi
          done

      - name: Push
        if: steps.changes.outputs.charts != ''
        run: |
          cd packaged
          for chart in ./*; do
            helm push $chart oci://ghcr.io/${{ github.repository }}
          done
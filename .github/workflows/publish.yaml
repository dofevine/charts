name: Helm Package and Publish

on:
  push:
    branches:
      - main

jobs:
  package-helm-chart:
    permissions:
      contents: read
      packages: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check changes
        id: changes
        run: |
          CHARTS=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} \
            | grep -E 'Chart.yaml|values.yaml|templates/' \
            | xargs -I{} dirname {} \
            | sort -u || true)

          echo "Charts changed:"
          echo "$CHARTS"

          echo "charts<<EOF" >> $GITHUB_OUTPUT
          echo "$CHARTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Package
        if: steps.changes.outputs.charts != ''
        run: |
          mkdir -p packaged
          for chart in ${{ steps.changes.outputs.charts }}; do
            if [ -f "$chart/Chart.yaml" ]; then
              helm package $chart -d packaged
            fi
          done

      - name: Push
        if: steps.changes.outputs.charts != ''
        run: |
          cd packaged
          for chart in ./*; do
            helm push $chart oci://ghcr.io/${{ github.repository }}
          done
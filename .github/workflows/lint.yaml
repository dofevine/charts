name: Helm Linting

on:
  pull_request:
    # paths:
    #     - "."
jobs:
  lint-helm-chart:
    permissions:
      contents: read
      packages: write
      security-events: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Identify changed charts
        id: changed
        run: |
          # Lista arquivos alterados no PR
          FILES=$(git diff --name-only origin/${{ github.base_ref }})

          # Filtra apenas charts
          CHANGED_CHARTS=""
          for f in $FILES; do
            if [[ "$f" == charts/*/Chart.yaml ]]; then
              chart_dir=$(dirname "$f")
              CHANGED_CHARTS="$CHANGED_CHARTS $chart_dir"
            fi
          done

          echo "changed_charts=$CHANGED_CHARTS" >> $GITHUB_OUTPUT
      
      
      
      - name: Run Trivy vulnerability scanner in IaC mode
        if: ${{ steps.changed.outputs.changed_charts != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const charts = "${{ steps.changed.outputs.changed_charts }}".trim().split(/\s+/);

            for (const chart of charts) {
              console.log(`Scanning ${chart}...`);

              await github.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "trivy-single.yml",
                ref: context.ref,
                inputs: { chart }
              });
            }

      # - name: Upload Trivy scan results to GitHub Security tab
      #   if: ${{ steps.changed.outputs.changed_charts != '' }}
      #   uses: github/codeql-action/upload-sarif@v4
      #   with:
      #     sarif_file: 'trivy-results.sarif'
      - name: No charts changed
        if: ${{ steps.changed.outputs.changed_charts == '' }}
        run: echo "Nenhum chart alterado no PR."
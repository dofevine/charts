replicaCount: 1

image:
  repository: crocodilestick/calibre-web-automated
  tag: v4.0.6
  pullPolicy: IfNotPresent

imagePullSecrets: []

env:
  TZ: UTC
  NETWORK_SHARE_MODE: "false"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}

podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8083

ingress:
  enabled: false
  className: ""
  annotations: {}

  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false

  annotations: {}

  parentRefs:
    - name: gateway
      sectionName: http

  hostnames:
    - chart-example.local

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /headers

resources: {}

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

extraVolumes: []

extraVolumeMounts: []

storage:
  keep: true
  storageClass: ""
  library:
    size: 1Gi
  config:
    size: 1Gi
  bookIngest:
    size: 1Gi

nodeSelector: {}

tolerations: []

affinity: {}

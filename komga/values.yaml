replicaCount: 1

nameOverride: ""

image:
  repository: gotson/komga
  pullPolicy: IfNotPresent
  tag: "1.24.3"

imagePullSecrets: []

args: {}
command: {}
env: []

serviceAccount:
  create: false
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 25600

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
      # namespace: default
  hostnames:
    - ""
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources: {}

livenessProbe: ""
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

extraVolumes: []

extraVolumeMounts: []


storage:
  keep: true
  storageClass: ""
  config:
    size: 1Gi
  data:
    existingClaim: ""
    size: 1Gi

nodeSelector: {}

tolerations: []

affinity: {}
